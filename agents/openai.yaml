interface:
  display_name: "GTM Preview Recette"
  short_description: "Run exhaustive client-side GTM acceptance QA"
  default_prompt: "Use $gtm-preview-recette to test every applicable tracking-plan interaction in order. Treat the plan as expected-value and journey support, never as the layer selector; derive each action boundary from fresh captured Preview and browser-network cursors, then close all 19 canonical layers and all 8 per-tag layers with exact tag identity, accepted expectation anchors, reconciled browser requests, and privacy-safe evidence. Default to analytics tag scope, keep detected exclusions visible, complete ordinary safe synthetic journeys, preserve interrupted attempts as honest BLOCKED evidence, and use the guided event-closure gate to deliver immediate per-event/per-layer/per-tag verdicts, computed outcome/anomaly labels, and the transactionally finalized XLSX and defect register."
