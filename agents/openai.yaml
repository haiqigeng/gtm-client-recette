interface:
  display_name: "GTM Client Recette"
  short_description: "Run Playwright-first expert GTM Preview acceptance QA"
  default_prompt: "Use $gtm-client-recette to run claim-driven client-side GTM Preview recette. Use the configured Playwright MCP server as the default browser runtime: launch one headed persistent Microsoft Edge profile, open and reuse the site and Tag Assistant tabs in that managed window, and fail before an action if the pinned runtime self-check fails. Use the normal init -> next -> one real interaction -> complete loop, and pass complete the exact action ID returned by next. Follow the frozen action card, never add a cleanup reload, second interaction, coordinate click, replacement browser, whole-container scan, or unsupported tool guess. Capture one bounded Preview delta per action; keep the fully expanded API Call, accumulated Data Layer state, Variables, concerned tag configuration/effective mapping/firing/runtime, decoded browser request, reality, and surrounding anomaly stream separate. Compare every destination-applicable planned field on every applicable surface and emit detailed per-event/per-layer feedback immediately. Use existing-window attachment only when the approved scope explicitly selects that fallback."
dependencies:
  tools:
    - type: "mcp"
      value: "playwright"
      description: "Microsoft Playwright MCP 0.0.79, configured headed with browser=msedge, a persistent workspace profile, and config capability for one runtime self-check."
