[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-preview-recette"
version = "2.0.0"
description = "Operational client-side GTM recette with exhaustive interaction and event-stream reconciliation"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.2", "pillow>=10.0.0"]

[project.optional-dependencies]
dev = ["ruff>=0.12.0"]
browser-test = ["playwright>=1.50.0,<2"]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
