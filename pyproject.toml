[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-preview-recette"
version = "1.0.0"
description = "Operational, plan-ordered GTM Preview recette with strict evidence reconciliation"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.2"]

[project.optional-dependencies]
dev = ["ruff>=0.12.0"]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
