[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-client-recette"
version = "7.0.0"
description = "Fast causal client-side GTM Preview acceptance recette"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.2", "PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["ruff>=0.12.0", "vulture>=2.14", "radon>=6.0"]
browser-test = ["playwright>=1.50.0,<2"]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
