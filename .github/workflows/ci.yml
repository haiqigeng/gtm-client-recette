name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[analysis,dev]"
      - run: python -m ruff check --no-cache .
      - run: python -m unittest discover -s tests -v
      - run: python -B scripts/check_release.py
      - run: python -B scripts/build_skill_package.py --output dist/gtm-preview-recette.zip
