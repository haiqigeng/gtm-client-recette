name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check scripts tests
      - run: python -m ruff format --check scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python -m vulture scripts tests --min-confidence 80
      - run: python -B scripts/check_release.py
      - run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -B scripts/build_skill_package.py --output "dist/gtm-client-recette-v${version}.zip"
          python -B scripts/verify_release_artifact.py "dist/gtm-client-recette-v${version}.zip"
      - name: Verify clean package installation
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -c 'from pathlib import Path; from zipfile import ZipFile; ZipFile(next(Path("dist").glob("*.zip"))).extractall("artifact-install")'
          python -B scripts/verify_release_artifact.py "dist/gtm-client-recette-v${version}.zip" --installed-skill artifact-install/gtm-client-recette
          python -B artifact-install/gtm-client-recette/scripts/recette.py --help

  browser-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[browser-test]"
      - run: python -m playwright install --with-deps chromium
      - run: python -B tests/run_browser_collector.py
