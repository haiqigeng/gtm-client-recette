name: Bug report
description: Report a reproducible skill, validation, or workbook problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include client data, domains, IDs, screenshots, credentials, or tracking plans.
  - type: textarea
    id: behaviour
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: skill-version
    attributes:
      label: Skill release
      description: Report the exact release or tag used, for example v1.0.0.
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Use synthetic values only.
    validations:
      required: true
