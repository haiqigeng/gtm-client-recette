name: Bug report
description: Report a reproducible skill, validation, or workbook problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include client data, domains, IDs, screenshots, credentials, or tracking plans.
  - type: textarea
    id: behaviour
    attributes:
      label: Observed behaviour
      description: Identify the affected layer (plan ingestion, browser/Preview connection, interaction completion/retry, adaptive settlement, recorder/Preview discrepancy, interaction coverage, occurrence/context, raw or resolved dataLayer, GTM variable, tag configuration/firing/runtime value, destination request, gated journey, consent, incremental validation, or workbook).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: skill-version
    attributes:
      label: Skill release
      description: Report the exact release or tag used, for example v2.2.0.
      placeholder: v2.2.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Use synthetic values only.
    validations:
      required: true
