name: Bug report
description: Report a reproducible skill, validation, or workbook problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include client data, domains, IDs, screenshots, credentials, or tracking plans.
  - type: textarea
    id: behaviour
    attributes:
      label: Observed behaviour
      description: Identify the affected area (plan/claim compilation, browser or Preview identity, reality, source signal, GTM decision, destination delivery, surrounding behavior, data safety, evidence confidence, scenario coverage, protected journey, event feedback, or final report).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: skill-version
    attributes:
      label: Skill release
      description: Report the exact release or source revision used, for example v6.0.1.
      placeholder: v6.0.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Use synthetic values only.
    validations:
      required: true
