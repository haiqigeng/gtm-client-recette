<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tag Assistant collector fixture</title>
  </head>
  <body>
    <nav id="events">
      <button data-event-index="1">1 Container Loaded</button>
      <button data-event-index="2">2 view_item</button>
      <button data-event-index="3">3 Trigger Group</button>
      <button data-event-index="4">4 add_to_cart</button>
    </nav>
    <nav id="tabs">
      <button data-panel="API Call">API Call</button>
      <button data-panel="Tags">Tags</button>
      <button data-panel="Data Layer">Data Layer</button>
      <button data-panel="Variables">Variables</button>
    </nav>
    <main role="tabpanel" id="panel"></main>
    <script>
      const fixture = {
        1: {
          api: `API call\ndataLayer.push({event: "gtm.js"})`,
          fired: false
        },
        2: {
          api: `API call
dataLayer.push({
  event: "view_item",
  ecommerce: {
    currency: "EUR",
    items: [{item_id: "SKU-" + "1", item_name: "Machine"}]
  }
})`,
          fired: true
        },
        3: {
          api: `API call\ndataLayer.push({event: "gtm.triggerGroup"})`,
          fired: false
        },
        4: {
          api: `API call
dataLayer.push({event: "add_to_cart", ecommerce: {currency: "EUR"}})`,
          fired: false
        }
      };
      let selectedEvent = 1;
      let selectedMode = "Values";
      window.__panelReads = {};
      const panel = document.querySelector("#panel");

      function renderApi() {
        panel.innerHTML = `<pre>${fixture[selectedEvent].api}</pre>`;
      }
      function renderTags() {
        window.__panelReads[`Tags:${selectedEvent}`] = (window.__panelReads[`Tags:${selectedEvent}`] || 0) + 1;
        panel.innerHTML = fixture[selectedEvent].fired
          ? `<h2>Tags Fired</h2>
             <button data-tag>GA4 - View Item
Google Analytics: GA4 Event
Succeeded</button>
             <h2>Tags Not Fired</h2>`
          : `<h2>Tags Fired</h2><h2>Tags Not Fired</h2>`;
        panel.querySelector("[data-tag]")?.addEventListener("click", renderDetail);
      }
      function renderDetail() {
        const values = selectedMode === "Names"
          ? `{currency: "{{DLV - currency}}", item_id: "{{DLV - item_id}}"}`
          : `{currency: "EUR", item_id: "SKU-1"}`;
        panel.innerHTML = `
          <button data-mode="Names">Names</button>
          <button data-mode="Values">Values</button>
          <button data-back>Back</button>
          <table>
            <tr><th>Type</th><td>Google Analytics: GA4 Event</td></tr>
            <tr><th>Event Parameters</th><td>${values}</td></tr>
          </table>`;
        panel.querySelectorAll("[data-mode]").forEach((button) => {
          button.addEventListener("click", () => {
            selectedMode = button.dataset.mode;
            renderDetail();
          });
        });
        panel.querySelector("[data-back]").addEventListener("click", renderTags);
      }
      document.querySelectorAll("[data-event-index]").forEach((button) => {
        button.addEventListener("click", () => {
          selectedEvent = Number(button.dataset.eventIndex);
          renderApi();
        });
      });
      document.querySelectorAll("[data-panel]").forEach((button) => {
        button.addEventListener("click", () => {
          if (button.dataset.panel === "API Call") renderApi();
          else if (button.dataset.panel === "Tags") renderTags();
          else panel.textContent = `${button.dataset.panel} diagnostic should not be opened`;
        });
      });
      renderApi();
    </script>
  </body>
</html>
