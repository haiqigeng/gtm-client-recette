<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Synthetic Tag Assistant</title></head>
  <body>
    <nav>
      <button class="event" data-cursor="1">1 Window Loaded</button>
      <button class="event" data-cursor="2">2 view_item</button>
      <button class="event" data-cursor="3">3 Window Loaded</button>
    </nav>
    <main>
      <button id="api-tab" role="tab">API Call</button>
      <button id="tags-tab" role="tab">Tags</button>
      <section id="panel" role="tabpanel"></section>
    </main>
    <script>
      const panel = document.querySelector("#panel");
      let selectedCursor = 3;
      const apiCall = `window.dataLayer.push({
        event: "view_item",
        ecommerce: {
          items: [{item_name: "Synthetic product", quantity: 1}],
          currency: "EUR"
        }
      });`;
      const showTags = () => {
        panel.innerHTML = selectedCursor === 2
          ? '<h2>Tags Fired</h2><button id="tag">GA4 - view_item</button><h2>Tags Not Fired</h2>'
          : '<h2>Tags Fired</h2><h2>Tags Not Fired</h2>';
        document.querySelector("#tag")?.addEventListener("click", showTagDetail);
      };
      const showTagDetail = () => {
        panel.innerHTML = '<button id="names">Names</button><button id="values">Values</button><button id="back">Back</button><div id="detail"></div>';
        document.querySelector("#names").addEventListener("click", () => {
          document.querySelector("#detail").innerHTML = '<table><tr><td>event</td><td>view_item</td></tr><tr><td>ecommerce</td><td>Data Layer</td></tr></table>';
        });
        document.querySelector("#values").addEventListener("click", () => {
          document.querySelector("#detail").innerHTML = '<table><tr><td>event</td><td>view_item</td></tr><tr><td>ecommerce</td><td>{"items":[{"item_name":"Synthetic product","quantity":1}],"currency":"EUR"}</td></tr></table>';
        });
        document.querySelector("#back").addEventListener("click", showTags);
      };
      document.querySelectorAll(".event").forEach((button) => {
        button.addEventListener("click", () => { selectedCursor = Number(button.dataset.cursor); });
      });
      document.querySelector("#api-tab").addEventListener("click", () => {
        panel.textContent = selectedCursor === 2 ? apiCall : 'window.dataLayer.push({event: "gtm.load"});';
      });
      document.querySelector("#tags-tab").addEventListener("click", showTags);
    </script>
  </body>
</html>
